<!DOCTYPE html>
<html lang="en">

<title>My resumes | ResumeMatch</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav" aria-label="Main">
  <a class="brand" href="upload.html">Resume<span>Match</span></a>
  <a class="link" href="upload.html">Upload</a>
  <a class="link" href="results.html">Results</a>
  <a class="link" href="resumes.html" aria-current="page">My resumes</a>

  <div class="actions" id="more" hidden><a class="btn" href="upload.html">Upload new resume</a></div>

<script type="module" src="js/resumes.js"></script>
