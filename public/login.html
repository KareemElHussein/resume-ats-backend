<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | ResumeMatch</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav" aria-label="Main">
  <a class="brand" href="upload.html">Resume<span>Match</span></a>
  <a class="link" href="upload.html">Upload</a>
  <a class="link" href="results.html">Results</a>
  <a class="link" href="resumes.html">My resumes</a>
  <a class="link login" href="login.html" aria-current="page">Log in</a>
</nav>
<main class="narrow">
  <h1>Log in</h1>
  <p class="lead">Log in to check your resume against a job and see your saved results.</p>
  <form class="card" id="form" data-mode="login" novalidate>
    <div class="live bad" id="form-error" role="alert"></div>
    <label for="email" class="first">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="err-email">
    <p class="error" id="err-email" hidden></p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="err-password">
    <p class="error" id="err-password" hidden></p>
    <div class="actions"><button class="btn" id="submit" type="submit">Log in</button></div>
  </form>
  <p>No account yet? <a id="switch" href="register.html">Create one</a></p>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
